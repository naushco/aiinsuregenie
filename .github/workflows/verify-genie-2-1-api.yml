name: Verify Genie 2.1 API release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-genie-2-1-api.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify production health and deterministic qualification without sending leads
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --max-time 30 https://api.aiinsuregenie.com/api/health > /tmp/health.json
          node -e "const h=require('/tmp/health.json');if(h.status!=='ok')process.exit(1)"
          for DATA in \
            '{"genie_v2":true,"genie_facts":{"state":"TX","situation":["sr22"],"situation_confirmed":true,"vehicle_status":"no_vehicle","coverage_goal":"unsure","coverage_goal_confirmed":true,"urgency":"within_week"}}' \
            '{"genie_v2":true,"genie_facts":{"state":"TX","situation_confirmed":true,"vehicle_status":"no_vehicle"}}'; do
            curl --fail-with-body -sS --max-time 30 \
              -H 'Origin: https://chat.aiinsuregenie.com' \
              -H 'Content-Type: application/json' \
              -d "$DATA" https://api.aiinsuregenie.com/api/plan >> /tmp/plans.jsonl
            echo >> /tmp/plans.jsonl
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const [done,partial]=fs.readFileSync('/tmp/plans.jsonl','utf8').trim().split('\n').map(JSON.parse);
          assert.equal(done.version,'2.1');
          assert.equal(done.complete,true);
          assert.equal(done.next.field,null);
          assert.equal(done.confirmed.vehicle_status,'no_vehicle');
          assert.deepEqual(done.confirmed.situation,['sr22']);
          assert.equal(partial.complete,false);
          assert.equal(partial.next.field,'coverage_goal');
          assert.equal(partial.confirmed.situation_confirmed,true);
          console.log('Genie 2.1 planner validates complete and missing qualification without PII');
          NODE

# Verify after successful Genie 2.1 API deployment.
