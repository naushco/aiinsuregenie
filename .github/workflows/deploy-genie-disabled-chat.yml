name: Deploy Genie disabled chatbot
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-genie-disabled-chat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: run disabled Genie chatbot deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/genie-2-intelligence
      - name: Verify reviewed source commit
        run: |
          test "$(git rev-parse HEAD)" = "43b7d33c86129cd5718813cec152c3ba4938caab"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chatbot/package-lock.json
      - name: Verify Cloudflare credentials are provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy disabled-only frontend
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-genie-disabled-chat.sh
      - name: Validate production assets and disabled flag
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://chat.aiinsuregenie.com/config.js?run=${GITHUB_RUN_ID}" > /tmp/config.js
          curl --fail --silent --show-error "https://chat.aiinsuregenie.com/?run=${GITHUB_RUN_ID}" > /tmp/index.html
          grep -q 'genieV2Enabled: staging' /tmp/config.js
          grep -q 'trustedform.js' /tmp/index.html
          grep -q 'xxTrustedFormCertUrl' /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
      - name: Roll back if the deployment failed verification
        if: failure() && steps.deployment.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/aiinsuregenie-chat/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"strategy":"percentage","versions":[{"version_id":"3e2ef721-2001-4ceb-a6db-ac6bcb570406","percentage":100}]}'
