<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
{{BRAND_HEAD}}
<link rel="stylesheet" href="/styles.css">
<style>
  .lp { background: var(--canvas); }
  .lp-top { background: #0f1b2d; border-bottom: 1px solid rgba(255,255,255,.08); }
  .lp-top .page { display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
  .lp-top .logo { color: #eef2f7; }
  .lp-top .logo em { color: var(--sun); }
  .lp-top .logo-mark { background: #1e3a5f; }
  .lp-top .trust-mini { color: #b4c0d0; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .lp-hero { background: #0f1b2d; color: #eef2f7; padding: 32px 0 48px; }
  .lp-hero .page { display: grid; gap: 32px; align-items: start; }
  @media (min-width: 900px) { .lp-hero .page { grid-template-columns: 1.05fr 1fr; gap: 56px; padding-top: 24px; } }
  /* Phones: headline, then the conversation right away, then the details */
  @media (max-width: 899.98px) {
    .lp-hero { padding: 20px 0 36px; }
    .lp-hero .page { gap: 0; }
    .lp-copy { display: contents; }
    .lp-kicker { order: 1; margin-bottom: 8px; }
    .lp-hero h1 { order: 2; font-size: 30px; margin-bottom: 16px; }
    .gc { order: 3; }
    .lp-hero .lede { order: 4; margin: 24px 0 16px; font-size: 17px; }
    .lp-points { order: 5; }
    .gc-log { min-height: 0; max-height: 62vh; overflow-y: auto; }
  }
  .lp-kicker { display: block; font-size: 14px; color: #a9bcd6; margin-bottom: 12px; }
  .lp-hero h1 { color: #fff; font-size: clamp(32px, 5vw, 48px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 16px; }
  .lp-hero h1 em { font-style: normal; color: var(--sun); }
  .lp-hero .lede { color: #c6d0dd; font-size: 18px; line-height: 1.55; margin: 0 0 20px; max-width: 46ch; }
  .lp-points { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .lp-points li { display: flex; gap: 10px; align-items: flex-start; color: #e3e9f1; font-size: 16px; line-height: 1.45; }
  .lp-points svg { flex: none; margin-top: 2px; color: var(--sun); }

  /* Genie conversation card */
  .gc { background: #fff; color: #0f1b2d; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.28); overflow: hidden; }
  .gc-hd { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e8ecf2; }
  .gc-av { width: 40px; height: 40px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; flex: none; position: relative; }
  .gc-av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #2fbf71; border: 2px solid #fff; }
  .gc-name { font-weight: 600; font-size: 16px; line-height: 1.2; }
  .gc-sub { font-size: 13px; color: #4a5a70; }
  .gc-log { padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 300px; background: #faf8f3; }
  .b { max-width: 86%; padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.45; animation: pop .25s ease-out both; }
  .b.g { align-self: flex-start; background: #fff; border: 1px solid #e3e6ec; border-bottom-left-radius: 4px; }
  .b.u { align-self: flex-end; background: #1e3a5f; color: #fff; border-bottom-right-radius: 4px; }
  .typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 14px 16px; background: #fff; border: 1px solid #e3e6ec; border-radius: 14px; border-bottom-left-radius: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8a96a8; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; animation: pop .25s ease-out both; }
  .opt { min-height: 44px; padding: 0 16px; border: 1.5px solid #1e3a5f; border-radius: 22px; background: #fff; color: #1e3a5f; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .opt:hover { background: #e8eef6; }
  .opt:focus-visible, .gc select:focus-visible, .go:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .gc select { width: 100%; min-height: 48px; padding: 0 12px; border: 1.5px solid #c5ccd6; border-radius: 10px; background: #fff; color: #0f1b2d; font: inherit; font-size: 16px; animation: pop .25s ease-out both; }
  .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin-top: 6px; border-radius: 12px; background: var(--sun); color: #3d2600; font-weight: 700; font-size: 17px; text-decoration: none; animation: pop .25s ease-out both; }
  .go:hover { background: var(--sun-hover); }
  .gc-ft { padding: 10px 16px 14px; font-size: 12px; color: #4a5a70; text-align: center; background: #faf8f3; border-top: 1px solid #eef1f5; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .b, .opts, .go, .gc select { animation: none; } .typing i { animation: none; } }

  .lp-sec { padding: 56px 0; }
  .lp-sec h2 { font-size: clamp(26px, 3.5vw, 34px); letter-spacing: -0.02em; margin: 0 0 24px; }
  .steps3 { display: grid; gap: 16px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
  @media (min-width: 760px) { .steps3 { grid-template-columns: repeat(3, 1fr); } }
  .steps3 li { background: #fff; border: 1px solid #e3e6ec; border-radius: 14px; padding: 20px; counter-increment: s; }
  .steps3 li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #1e3a5f; color: #fff; font-weight: 700; margin-bottom: 12px; }
  .steps3 h3 { font-size: 18px; margin: 0 0 6px; }
  .steps3 p { margin: 0; color: #4a5a70; line-height: 1.5; }
  .lp-faq { max-width: 760px; }
  .lp-faq details { background: #fff; border: 1px solid #e3e6ec; border-radius: 12px; margin-bottom: 10px; }
  .lp-faq summary { cursor: pointer; padding: 16px 18px; font-weight: 600; font-size: 17px; min-height: 44px; }
  .lp-faq details p { margin: 0; padding: 0 18px 16px; color: #4a5a70; line-height: 1.55; }
  .lp-final { background: #0f1b2d; color: #fff; text-align: center; padding: 48px 0 56px; }
  .lp-final h2 { color: #fff; margin: 0 0 16px; font-size: clamp(26px, 3.5vw, 34px); }
  .lp-final .btn { min-height: 52px; padding: 0 28px; font-size: 17px; }
  .lp-legal { padding: 24px 0 96px; font-size: 13px; color: #4a5a70; line-height: 1.55; }
  .lp-legal a { color: #1e3a5f; }
  .lp-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.97); border-top: 1px solid #e3e6ec; box-shadow: 0 -8px 24px rgba(15,27,45,.08); transform: translateY(110%); transition: transform .2s ease-out; }
  .lp-bar.show { transform: none; }
  .lp-bar .btn { width: 100%; min-height: 50px; }
  @media (max-width: 767.98px) { .lp-bar { display: block; } }
</style>
{{PIXEL}}
</head>
<body class="lp">
<header class="lp-top">
  <div class="page">
    <a class="logo" href="{{HOME}}" aria-label="AI InsureGenie"><span class="logo-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M11 3.2l6.6 2.8v4.8c0 4.4-2.8 8-6.6 9.7-3.8-1.7-6.6-5.3-6.6-9.7V6z" fill="var(--sun)"/><path d="M8.2 11.6l2 2 3.8-3.9" fill="none" stroke="#0f1b2d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.6 1.6l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#fff"/></svg></span><span>AI Insure<em>Genie</em></span></a>
    <span class="trust-mini"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>{{TRUST_MINI}}</span>
  </div>
</header>

<main>
<section class="lp-hero">
  <div class="page">
    <div class="lp-copy">
      <span class="lp-kicker">{{KICKER}}</span>
      <h1>{{H1}}</h1>
      <p class="lede">{{LEDE}}</p>
      <ul class="lp-points">{{POINTS}}</ul>
    </div>

    <div class="gc" id="gc" aria-live="polite">
      <div class="gc-hd">
        <span class="gc-av" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 3.2l6.6 2.8v4.8c0 4.4-2.8 8-6.6 9.7-3.8-1.7-6.6-5.3-6.6-9.7V6z" fill="#0f1b2d"/><path d="M8.2 11.6l2 2 3.8-3.9" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><div class="gc-name">Genie</div><div class="gc-sub">{{GENIE_SUB}}</div></div>
      </div>
      <div class="gc-log" id="log"></div>
      <div class="gc-ft">{{CARD_NOTE}}</div>
    </div>
  </div>
</section>

<section class="lp-sec">
  <div class="page">
    <h2>{{HOW_TITLE}}</h2>
    <ol class="steps3">{{STEPS}}</ol>
  </div>
</section>

<section class="lp-sec" style="padding-top:0">
  <div class="page lp-faq">
    <h2>{{FAQ_TITLE}}</h2>
    {{FAQ}}
  </div>
</section>

<section class="lp-final" id="final">
  <div class="page">
    <h2>{{FINAL_TITLE}}</h2>
    <a class="btn btn-sun" href="#gc" data-scroll>{{FINAL_BTN}}</a>
  </div>
</section>

<div class="page lp-legal">{{LEGAL}}</div>
</main>

<div class="lp-bar" id="bar" aria-hidden="true"><a class="btn btn-sun" href="#gc" data-scroll tabindex="-1">{{BAR_BTN}}</a></div>

<script>
(function () {
  var C = {{CONFIG}};
  var CHAT = 'https://chat.aiinsuregenie.com/';
  var log = document.getElementById('log');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ans = {};
  function track(ev, data) { try { if (window.fbq) fbq('track', ev, data || {}); } catch (e) {} }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function scrollLog() { log.scrollTop = log.scrollHeight; }
  // Genie "types" for a moment sized to the message, so it reads like a person replying.
  function say(lines, done) {
    var i = 0;
    (function next() {
      if (i >= lines.length) { if (done) done(); return; }
      var t = el('div', 'typing'); t.innerHTML = '<i></i><i></i><i></i>'; t.setAttribute('aria-label', C.typing);
      log.appendChild(t); scrollLog();
      var wait = reduce ? 150 : Math.min(1400, 450 + lines[i].length * 14);
      setTimeout(function () { t.remove(); log.appendChild(el('div', 'b g', lines[i])); scrollLog(); i++; setTimeout(next, reduce ? 0 : 250); }, wait);
    })();
  }
  function me(text) { log.appendChild(el('div', 'b u', text)); scrollLog(); }
  function chips(list, onPick) {
    var w = el('div', 'opts');
    list.forEach(function (o) {
      var b = el('button', 'opt', o.label); b.type = 'button';
      b.onclick = function () { w.remove(); me(o.label); onPick(o); };
      w.appendChild(b);
    });
    log.appendChild(w); scrollLog();
  }
  function statePick(onPick) {
    var s = document.createElement('select'); s.setAttribute('aria-label', C.stateLabel);
    s.innerHTML = '<option value="">' + C.statePlaceholder + '</option>' + C.states.map(function (n) { return '<option>' + n + '</option>'; }).join('');
    s.onchange = function () { if (!s.value) return; var v = s.value; s.remove(); me(v); onPick(v); };
    log.appendChild(s); scrollLog();
  }
  function finish(o) {
    var p = new URLSearchParams();
    if (o.agent) p.set('start', 'agent');
    else { p.set('start', 'quote'); p.set('goal', o.goal || 'price'); if (ans.state) p.set('state', ans.state); }
    var lines = (o.reply || C.wrap).map(function (l) { return l.replace('{state}', ans.state || ''); });
    say(lines, function () {
      var a = el('a', 'go'); a.href = CHAT + '#' + p.toString(); a.textContent = o.agent ? C.goAgent : C.go;
      a.insertAdjacentHTML('beforeend', ' <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
      a.onclick = function () { track('Lead', { content_name: C.page }); };
      log.appendChild(a); scrollLog();
    });
  }
  function start() {
    say(C.hello, function () {
      statePick(function (st) {
        ans.state = st; track('ViewContent', { content_name: C.page });
        say(C.afterState.map(function (l) { return l.replace('{state}', st); }), function () { chips(C.q2, finish); });
      });
    });
  }
  // Begin when the card is on screen (immediately on most phones/desktops).
  var started = false;
  function go() { if (!started) { started = true; start(); } }
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { go(); io.disconnect(); } }); io.observe(document.getElementById('gc')); } else go();

  // Buttons lower on the page bring the visitor back to the conversation.
  [].forEach.call(document.querySelectorAll('[data-scroll]'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); document.getElementById('gc').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); go(); });
  });
  // Sticky phone button, hidden while the conversation or final section is visible.
  var bar = document.getElementById('bar');
  if (bar && 'IntersectionObserver' in window) {
    var seen = {};
    var watch = [document.getElementById('gc'), document.getElementById('final')];
    var bio = new IntersectionObserver(function (es) {
      es.forEach(function (e) { seen[watch.indexOf(e.target)] = e.isIntersecting; });
      var show = !seen[0] && !seen[1] && window.scrollY > 200;
      bar.classList.toggle('show', show); bar.setAttribute('aria-hidden', String(!show)); bar.querySelector('a').tabIndex = show ? 0 : -1;
    });
    watch.forEach(function (w) { bio.observe(w); });
  }
})();
</script>
</body>
</html>
