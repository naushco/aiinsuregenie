<style>
  .gbox { padding: 0; margin: var(--s8) 0 var(--s10); background: #fff; color: #0f1b2d; border: 1px solid #e3e6ec; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,27,45,.08); overflow: hidden; }
  .gbox-hd { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e8ecf2; background: #0f1b2d; color: #eef2f7; }
  .gbox-av { width: 40px; height: 40px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; flex: none; position: relative; }
  .gbox-av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #2fbf71; border: 2px solid #0f1b2d; }
  .gbox-name { font-weight: 600; font-size: 16px; line-height: 1.2; }
  .gbox-sub { font-size: 13px; color: #b4c0d0; }
  .gbox-log { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; max-height: 70vh; overflow-y: auto; }
  .gbox .b { max-width: 100%; font-size: 17px; line-height: 1.55; animation: gpop .25s ease-out both; margin: 0; }
  .gbox .b.g { align-self: flex-start; color: #0f1b2d; }
  .gbox .b.u { align-self: flex-end; background: #e9eef5; color: #0f1b2d; border-radius: 20px; padding: 10px 16px; margin: 6px 0; max-width: 86%; }
  .gbox .typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 8px 0; margin: 0; background: none; border: 0; border-radius: 0; }
  .gbox .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8a96a8; animation: gblink 1.2s infinite; }
  .gbox .typing i:nth-child(2) { animation-delay: .2s; } .gbox .typing i:nth-child(3) { animation-delay: .4s; }
  .gbox .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; animation: gpop .25s ease-out both; }
  .gbox .opt { min-height: 44px; padding: 0 16px; border: 1.5px solid #1e3a5f; border-radius: 22px; background: #fff; color: #1e3a5f; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .gbox .opt:hover { background: #e8eef6; }
  .gbox select { width: 100%; min-height: 48px; padding: 0 12px; border: 1.5px solid #c5ccd6; border-radius: 10px; background: #fff; color: #0f1b2d; font: inherit; font-size: 16px; animation: gpop .25s ease-out both; }
  .gbox .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin-top: 6px; border-radius: 12px; background: var(--sun); color: #3d2600; font-weight: 700; font-size: 17px; text-decoration: none; animation: gpop .25s ease-out both; }
  .gbox .go:hover { background: var(--sun-hover); }
  .gbox .opt:focus-visible, .gbox select:focus-visible, .gbox .go:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .gbox-ft { padding: 10px 16px 14px; font-size: 12px; color: #4a5a70; text-align: center; border-top: 1px solid #eef1f5; }
  @keyframes gpop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes gblink { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .gbox .b, .gbox .opts, .gbox .go, .gbox select { animation: none; } .gbox .typing i { animation: none; } }
</style>
<section class="gbox" id="genie" aria-label="{{ARIA}}">
  <div class="gbox-hd">
    <span class="gbox-av" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 3.2l6.6 2.8v4.8c0 4.4-2.8 8-6.6 9.7-3.8-1.7-6.6-5.3-6.6-9.7V6z" fill="#0f1b2d"/><path d="M8.2 11.6l2 2 3.8-3.9" fill="none" stroke="#ffc247" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div><div class="gbox-name">Genie</div><div class="gbox-sub">{{SUB}}</div></div>
  </div>
  <div class="gbox-log" aria-live="polite"></div>
  <div class="gbox-ft">{{NOTE}}</div>
</section>
<script>
(function () {
  var C = {{CONFIG}};
  var CHAT = 'https://chat.aiinsuregenie.com/';
  var box = document.getElementById('genie'), log = box.querySelector('.gbox-log');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ans = { state: C.state || '' };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function down() { log.scrollTop = log.scrollHeight; }
  function fill(l) { return l.replace('{state}', ans.state); }
  function say(lines, done) {
    var i = 0;
    (function next() {
      if (i >= lines.length) { if (done) done(); return; }
      var t = el('div', 'typing'); t.innerHTML = '<i></i><i></i><i></i>'; t.setAttribute('aria-label', C.typing);
      log.appendChild(t); down();
      var line = fill(lines[i]), wait = reduce ? 150 : Math.min(1400, 450 + line.length * 14);
      setTimeout(function () { t.remove(); log.appendChild(el('p', 'b g', line)); down(); i++; setTimeout(next, reduce ? 0 : 250); }, wait);
    })();
  }
  function me(x) { log.appendChild(el('p', 'b u', x)); down(); }
  function chips(list, pick) {
    var w = el('div', 'opts');
    list.forEach(function (o) { var b = el('button', 'opt', o.label); b.type = 'button'; b.onclick = function () { w.remove(); me(o.label); pick(o); }; w.appendChild(b); });
    log.appendChild(w); down();
  }
  function statePick(pick) {
    var s = document.createElement('select'); s.setAttribute('aria-label', C.stateLabel);
    s.innerHTML = '<option value="">' + C.statePlaceholder + '</option>' + C.states.map(function (n) { return '<option>' + n + '</option>'; }).join('');
    s.onchange = function () { if (!s.value) return; var v = s.value; s.remove(); me(v); pick(v); };
    log.appendChild(s); down();
  }
  function finish(o) {
    var p = new URLSearchParams();
    if (o.agent) p.set('start', 'agent'); else { p.set('start', 'quote'); p.set('goal', o.goal || 'price'); if (ans.state) p.set('state', ans.state); }
    say(o.reply || [], function () {
      var a = el('a', 'go'); a.href = CHAT + '#' + p.toString(); a.textContent = o.agent ? C.goAgent : C.go;
      a.insertAdjacentHTML('beforeend', ' <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
      log.appendChild(a); down();
    });
  }
  function start() {
    if (ans.state) { say(C.hello.concat(C.afterState), function () { chips(C.q2, finish); }); return; }
    say(C.hello, function () { statePick(function (st) { ans.state = st; say(C.afterState, function () { chips(C.q2, finish); }); }); });
  }
  var started = false;
  function go() { if (!started) { started = true; start(); } }
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { go(); io.disconnect(); } }, { threshold: 0.3 }); io.observe(box); } else go();
})();
</script>
